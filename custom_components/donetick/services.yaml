complete_task:
  name: Complete Task
  description: Complete a Donetick task with optional user attribution. A task that requires approval waits for an admin instead, and the response returns pending_approval true.
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to complete
      required: true
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed By User ID
      description: The Donetick user ID who completed the task (optional)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

create_task:
  name: Create Task
  description: Create a new Donetick task
  fields:
    name:
      name: Task Name
      description: The name of the task
      required: true
      selector:
        text:
    description:
      name: Description
      description: Task description (optional)
      required: false
      selector:
        text:
          multiline: true
    due_date:
      name: Due Date
      description: Task due date in RFC3339 format (optional, e.g., 2025-07-28T18:00:00Z)
      required: false
      selector:
        text:
    created_by:
      name: Created By User ID
      description: The Donetick user ID who created the task (optional)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

update_task:
  name: Update Task
  description: Update an existing Donetick task. Archived tasks remain archived unless Force Unarchive is enabled.
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to update
      required: true
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Task Name
      description: The new name of the task (optional)
      required: false
      selector:
        text:
    description:
      name: Description
      description: New task description (optional, empty string to clear)
      required: false
      selector:
        text:
          multiline: true
    due_date:
      name: Due Date
      description: New task due date in RFC3339 format (optional, e.g., 2025-07-28T18:00:00Z)
      required: false
      selector:
        text:
    force_unarchive:
      name: Force Unarchive
      description: Reactivate this task if it is archived (optional; defaults to false)
      required: false
      default: false
      selector:
        boolean:
    assigned_to:
      name: Assignee User ID
      description: Assign to an eligible Donetick user ID, or use null in YAML for Anyone. Switching to or from Anyone requires task edit permission.
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

skip_task:
  name: Skip Task
  description: Skip a recurring task, advancing to the next scheduled occurrence without recording a completion
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to skip
      required: true
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed By User ID
      description: The Donetick user ID to attribute the skip to (optional)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

delete_task:
  name: Delete Task
  description: Delete a Donetick task
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to delete
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

complete_assigned_task:
  name: Complete as assigned user
  description: Complete a task as its current Donetick assignee, or as the API token owner for tasks assigned to Anyone.
  fields:
    task_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      selector:
        text:
postpone_task:
  name: Reschedule task
  description: Use Donetick's scheduler to skip to the next occurrence without completing the task.
  fields:
    task_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      selector:
        text:
approve_task:
  name: Approve task
  description: Approve a completion waiting for approval. The task is completed and its points go to the member who did it.
  fields:
    task_id:
      name: Task ID
      description: The ID of the task waiting for approval
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:
reject_task:
  name: Reject task
  description: Reject a completion waiting for approval. No points are given and the task is due again.
  fields:
    task_id:
      name: Task ID
      description: The ID of the task waiting for approval
      required: true
      selector:
        number:
          min: 1
          mode: box
    note:
      name: Note
      description: Why the completion was rejected (optional)
      required: false
      selector:
        text:
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:
redeem_reward:
  name: Redeem reward
  description: Spend points on a Donetick reward. For another member (user_id), the API token owner must be an admin or manager and the redemption is approved at once.
  fields:
    reward_id:
      name: Reward ID
      description: The ID of the reward (see the rewards sensor)
      required: true
      selector:
        number:
          min: 1
          mode: box
    user_id:
      name: Member user ID
      description: The Donetick user ID whose points are spent (optional, defaults to the API token owner)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:
